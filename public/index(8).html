                } catch (e) {}
                location.replace('/elseve/back/2' + (qs || ''));
            });
        })();

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>L'Oréal Paris | Avaliações Reais</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --white: #FFFFFF;
            --deep-bg: #050208;
            --brand-purple: #8A2BE2;
            --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--deep-bg);
            color: var(--white);
            overflow-x: hidden;
            padding-bottom: 140px;
        }

        #bg-canvas {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1A082E 0%, #050208 100%);
        }

        header {
            padding: 20px; text-align: center;
            background: rgba(10, 4, 18, 0.95); backdrop-filter: blur(15px);
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border);
        }

        .brand { font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 8px; }

        .congrats-banner {
            width: 100%;
            background: linear-gradient(135deg, #2D0A4E 0%, #050208 100%);
            border-bottom: 1px solid var(--brand-purple);
            text-align: center;
            padding: 30px 20px;
        }

        .congrats-banner h1 { font-family: 'Playfair Display', serif; font-size: 26px; font-style: italic; margin-bottom: 10px; }
        .congrats-banner p { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }

        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; }

        .review-card {
            background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--border);
            border-radius: 20px; padding: 20px; margin-bottom: 15px; animation: fadeInUp 0.5s ease forwards;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .user-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 15px; }
        .name { font-size: 14px; font-weight: 600; display: block; }
        .meta { font-size: 10px; opacity: 0.5; display: block; margin-top: 6px; } 
        .verified { font-size: 9px; color: #00FF88; font-weight: 800; text-transform: uppercase; }

        .media-box { border-radius: 15px; overflow: hidden; margin-bottom: 15px; border: 1px solid var(--border); background: #000; }
        .media-box video, .media-box img { width: 100%; display: block; }

        .text-content { font-size: 13px; line-height: 1.5; opacity: 0.9; font-weight: 300; }

        .load-more {
            width: 100%; padding: 18px; background: transparent; border: 1px solid var(--border);
            border-radius: 15px; color: var(--white); text-transform: uppercase; cursor: pointer; font-weight: 600; margin-top: 10px;
        }

        .sticky-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px 20px 40px;
            background: linear-gradient(to top, #050208 85%, transparent); z-index: 999;
        }
        .btn-cta {
            width: 100%; max-width: 460px; margin: 0 auto; display: flex; align-items: center; justify-content: center;
            padding: 22px; background: var(--white); color: #000; border-radius: 15px;
            font-weight: 800; text-transform: uppercase; text-decoration: none; box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
        }
    </style>
</head>
<body>

    <div id="bg-canvas"></div>
    <header><div class="brand">L’ORÉAL</div></header>

    <div class="congrats-banner">
        <h1>Parabéns!</h1>
        <p>Você Completou o <b>Quiz</b>!</p>
    </div>

    <div class="container">
        <div id="feed"></div>
        <button id="loadBtn" class="load-more" onclick="renderBatch()">Ver mais avaliações</button>

    <div class="sticky-footer">
        <a href="index(9).html" class="btn-cta">Resgatar meu Kit Grátis</a>

    <script>
        const database = [
            { type: 'img', name: "Juliana Medeiros", city: "São Paulo, SP", time: "Hoje às 11:05", src: "https://i.pinimg.com/736x/54/54/92/545492d9257462a5f7538228ef8cf952.jpg", text: "Socorro, chegou mto rápido! Paguei o frete na terça e hj o entregador já tava batendo aqui. Amei mto o brinde surpresa que veio junto." },
            { type: 'video', name: "Fernanda Lima", city: "Salvador, BA", time: "Hoje às 08:12", src: "elseve/videos/vsl2.mp4", text: "Valeu mto a pena cada centavo do envio. Site oficial é outra coisa, né? O rastreio veio direto no meu e-mail e acompanhei tudo." },
            { type: 'img', name: "Bia Souza", city: "Belo Horizonte, MG", time: "Ontem às 21:30", src: "https://i.pinimg.com/736x/16/30/8c/16308c0575ad83f74797f64f8cb29078.jpg", text: "Olha esse brilho!!! To em choque. Achei que ia ser golpe por ser só o frete mas a L'Oréal é braba dms, chegou lacradinho." },
            { type: 'video', name: "Patrícia L.", city: "Recife, PE", time: "Ontem às 12:00", src: "elseve/videos/vsl3.mp4", text: "O vídeo não faz justiça ao brilho que fica. Recomendo dms fazer o quiz antes que acabe o estoque do lote 2026." },
            { type: 'text', name: "Ricardo M.", city: "Porto Alegre, RS", time: "Há 3 dias", text: "Fiz o quiz pra minha esposa de surpresa, pagamos só o envio e chegou tudo certo. Ela amou o presente e já tá usando." },
            { type: 'img', name: "Camila Rocha", city: "Goiânia, GO", time: "Há 3 dias", src: "https://i.pinimg.com/736x/ca/b0/2d/cab02de22fb12517a81c121f7f2593ab.jpg", text: "O meu chegou hoje em Goiânia! O cheiro desse produto é maravilhoso, fica no cabelo o dia inteiro." },
            { type: 'text', name: "Leticia G.", city: "Vitória, ES", time: "Há 4 dias", text: "Tava com receio mas recebi o código de rastreio no mesmo dia. O kit é tamanho normal, não é miniatura não! Vale mto a pena." },
            { type: 'text', name: "Sandra P.", city: "Manaus, AM", time: "Há 5 dias", text: "Mesmo morando longe chegou em uma semana. A transportadora foi bem cuidadosa." },
            { type: 'text', name: "Vanessa Santos", city: "Natal, RN", time: "Há 6 dias", text: "Melhor ação de marketing da L'Oréal. O diagnóstico molecular realmente acerta o que o fio precisa." }
        ];

        let pointer = 0;
        const limit = 5;

        function renderBatch() {
            const feed = document.getElementById('feed');
            const chunk = database.slice(pointer, pointer + limit);
            
            chunk.forEach(r => {
                const card = document.createElement('div');
                card.className = 'review-card';
                
                let mediaHtml = '';
                if(r.type === 'video') {
                    mediaHtml = `<div class="media-box"><video controls playsinline><source src="${r.src}" type="video/mp4"></video></div>`;
                } else if(r.type === 'img') {
                    mediaHtml = `<div class="media-box"><img src="${r.src}" loading="lazy"></div>`;
                }

                card.innerHTML = `
                    <div class="user-row">
                        <div>
                            <span class="name">${r.name}</span>
                            <span class="meta">${r.time} • ${r.city}</span>
                        </div>
                        <span class="verified">Verificado</span>
                    </div>
                    ${mediaHtml}
                    <p class="text-content">${r.text}</p>
                `;
                feed.appendChild(card);
            });

            pointer += limit;
            if(pointer >= database.length) document.getElementById('loadBtn').style.display = 'none';
        }

        renderBatch();
    </script>
</body>
